name: Browser E2E
run-name: Browser E2E for ${{ inputs.target_sha || github.sha }}

# Full browser verification is a manual production-release gate.
# Run on the exact main SHA intended for deployment; do not run for every PR.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character commit SHA (required for main releases; optional for transition PR checks)"
        required: false
        type: string

# Manual E2E verification uses isolated synthetic data and no production secrets.
permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_PORT: "3100"
      # pnpm build runs first; Playwright must start that exact production build.
      E2E_SKIP_BUILD: "1"
    steps:
      # The dispatch ref selects the workflow definition; this explicit ref selects
      # the *application commit being tested*, including if main moves meanwhile.
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact E2E target SHA
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
          PROVIDED_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid target SHA"; exit 1; }
          test "$(git rev-parse HEAD)" = "$TARGET_SHA" || { echo "Checkout SHA mismatch"; exit 1; }
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Releases must specify the SHA; only the transition PR may fall back to its branch tip.
            test -n "$PROVIDED_SHA" || { echo "Explicit target_sha required for main release"; exit 1; }
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$TARGET_SHA" FETCH_HEAD || {
              echo "Release SHA is not reachable from main"; exit 1;
            }
          fi
          echo "VERIFIED_E2E_TARGET_SHA=$TARGET_SHA"
          echo "### Exact browser E2E target" >> "$GITHUB_STEP_SUMMARY"
          echo "`$TARGET_SHA`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Deployment script syntax
        run: bash -n deployment/deploy-safe.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run all browser E2E tests
        run: pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
