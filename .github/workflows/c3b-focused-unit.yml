name: C-3b focused unit/security regression
on:
  pull_request:
    paths:
      - ".github/workflows/c3b-focused-unit.yml"
      - "lib/target-inbox-accept-writer.ts"
      - "lib/target-inbox-metadata-validation.ts"
      - "lib/target-inbox-c3b*"
      - "lib/target-staging-session-authority.ts"
      - "scripts/target-staging-inbox-c3b-child.mjs"
      - "app/api/target-staging/inbox/c3b/**"
      - "tests/target-inbox-accept-writer.test.mjs"
      - "tests/target-inbox-c3b-http.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Canonical Accept/cancel/Undo, HTTP security and consent
        run: node --experimental-loader ./tests/ts-loader.mjs --test tests/target-inbox-accept-writer.test.mjs tests/target-inbox-c3b-http.test.mjs tests/target-inbox-ai-consent.test.mjs
