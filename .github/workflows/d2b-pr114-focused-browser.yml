name: D2b PR114 focused recovery picker test

on:
  push:
    branches:
      - codex/d2b-read-only-rescue-review-20261025
    paths:
      - .github/workflows/d2b-pr114-focused-browser.yml
      - e2e/app.spec.ts
      - app/ui/views/offline-recovery-dialog.tsx

permissions:
  contents: read

jobs:
  focused-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_PORT: '3100'
      E2E_SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the one focused recovery picker scenario
        run: pnpm exec playwright test e2e/app.spec.ts --grep 'native recovery file-picker cancel'
      - name: Upload browser trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: d2b-pr114-focused-trace
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
