name: PR Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No production secrets or write permissions are needed for PR validation.
permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-checks:
    name: PR Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Deployment script syntax
        run: bash -n deployment/deploy-safe.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Focused Next router HTTP smoke
        run: node --experimental-loader ./tests/ts-loader.mjs scripts/target-staging-next-smoke.mjs
