name: PR Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No production secrets or write permissions are needed for PR validation.
permissions:
  contents: read

concurrency:
  # Cancel obsolete PR attempts, never checks of distinct main commits.
  group: pr-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-checks:
    name: PR Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Deployment script syntax
        run: bash -n deployment/deploy-safe.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      # Focused PR-only browser verification, not the release-only full E2E suite.
      - name: Install Chromium for D2b focused regression
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 114
        run: pnpm exec playwright install --with-deps chromium

      - name: Run D2b picker cancellation browser regression
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 114
        env:
          E2E_SKIP_BUILD: "1"
        run: pnpm exec playwright test e2e/app.spec.ts --grep "native recovery file-picker cancel"
