name: R2d project read regressions

on:
  pull_request:
    paths:
      - ".github/workflows/r2d-project-reads.yml"
      - "lib/target-project-task-read-model.ts"
      - "lib/target-project-structural-relations.ts"
      - "lib/target-parent-backlinks.ts"
      - "lib/target-authorized-project-index.ts"
      - "lib/target-my-plan-home-summary.ts"
      - "lib/target-scoped-home-summary.ts"
      - "lib/target-task-temporal-read-model.ts"
      - "lib/target-task-temporal-status-writer.ts"
      - "lib/target-staging-anchor-journal.ts"
      - "lib/target-store-preflight.ts"
      - "lib/target-project-id.ts"
      - "lib/target-task-read-model.ts"
      - "lib/target-staging-read-limits.ts"
      - "lib/target-staging-project-http-cursor.ts"
      - "lib/target-staging-durable-session.ts"
      - "lib/target-staging-http-identity.ts"
      - "lib/target-store-bootstrap.ts"
      - "lib/target-task-staging-reader.ts"
      - "lib/target-staging-session-authority.ts"
      - "lib/target-staging-read-process.ts"
      - "scripts/target-staging-project-tasks-child.mjs"
      - "scripts/target-staging-project-relations-child.mjs"
      - "scripts/target-staging-parent-backlink-child.mjs"
      - "scripts/target-staging-project-index-child.mjs"
      - "scripts/target-staging-temporal-read-child.mjs"
      - "scripts/target-staging-temporal-detail-child.mjs"
      - "scripts/target-staging-my-plan-home-child.mjs"
      - "scripts/target-staging-scoped-home-child.mjs"
      - "scripts/target-staging-child-actor.mjs"
      - "app/api/target-staging/projects/**"
      - "app/api/target-staging/project-index/**"
      - "app/api/target-staging/task-temporal/**"
      - "app/api/target-staging/home/**"
      - "app/api/target-staging/relations/**"
      - "tests/target-staging-project-tasks.test.mjs"
      - "tests/target-staging-project-relations-http.test.mjs"
      - "tests/target-staging-parent-backlinks-http.test.mjs"
      - "tests/target-staging-project-index.test.mjs"
      - "tests/target-task-temporal-schema.test.mjs"
      - "tests/target-task-temporal-read.test.mjs"
      - "tests/target-staging-temporal-http.test.mjs"
      - "tests/target-task-temporal-status-writer.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2d-project-reads-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  focused-projects:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Targeted ACL and project pagination tests
        run: node --experimental-loader ./tests/ts-loader.mjs --test tests/target-staging-project-tasks.test.mjs tests/target-staging-project-index.test.mjs tests/target-staging-project-relations-http.test.mjs tests/target-staging-parent-backlinks-http.test.mjs tests/target-task-temporal-schema.test.mjs tests/target-task-temporal-read.test.mjs tests/target-staging-temporal-http.test.mjs tests/target-task-temporal-status-writer.test.mjs
