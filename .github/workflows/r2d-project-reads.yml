permissions:
  contents: read

concurrency:
  group: r2d-project-reads-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  focused-projects:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Targeted ACL and project pagination tests
        run: node --experimental-loader ./tests/ts-loader.mjs --test tests/target-staging-project-tasks.test.mjs tests/target-staging-project-index.test.mjs tests/target-staging-project-relations-http.test.mjs tests/target-staging-parent-backlinks-http.test.mjs tests/target-task-temporal-schema.test.mjs tests/target-task-temporal-read.test.mjs tests/target-task-due-window-read.test.mjs tests/target-task-personal-when-schema.test.mjs tests/target-personal-when-read.test.mjs tests/target-my-plan-day-task-read.test.mjs tests/target-global-task-read.test.mjs tests/target-global-project-read.test.mjs tests/target-global-note-read.test.mjs tests/target-global-combined-read.test.mjs tests/target-staging-global-task-http.test.mjs tests/target-staging-global-project-http.test.mjs tests/target-staging-global-note-http.test.mjs tests/target-staging-global-combined-http.test.mjs tests/target-staging-my-plan-day-http.test.mjs tests/target-staging-attention-http.test.mjs tests/target-staging-attention-command-http.test.mjs tests/target-staging-notifications-http.test.mjs tests/target-personal-when-writer.test.mjs tests/target-staging-personal-when-command-http.test.mjs tests/target-staging-personal-when-http.test.mjs tests/target-staging-temporal-due-window-http.test.mjs tests/target-staging-temporal-http.test.mjs tests/target-task-temporal-status-writer.test.mjs tests/target-task-temporal-due-on-writer.test.mjs tests/target-staging-temporal-status-http.test.mjs tests/target-staging-temporal-due-on-http.test.mjs tests/target-r2d-security-matrix.test.mjs tests/target-r2d-security-matrix-mutation-guards.test.mjs tests/target-staging-session-generation-http.test.mjs tests/target-client-runtime.test.mjs tests/target-client-errors.test.mjs tests/target-client-runtime-wiring.test.mjs tests/target-ui-config.test.mjs tests/target-my-plan-embed.test.mjs tests/target-client-runtime-poll.test.mjs tests/target-my-plan-scope-feedback.test.mjs tests/target-staging-global-index-client.test.mjs 