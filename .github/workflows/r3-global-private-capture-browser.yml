name: Focused R3 global private capture browser
on:
  pull_request:
    paths:
      - ".github/workflows/r3-global-private-capture-browser.yml"
      - "app/ui/lumi-app-root.tsx"
      - "app/ui/views/mobile-nav.tsx"
      - "app/ui/views/desktop-capture-fab.tsx"
      - "app/ui/views/sidebar.tsx"
      - "app/ui/target-private-note-area-chooser.tsx"
      - "app/ui/target-detail-panel.tsx"
      - "app/ui/target-scope-state.ts"
      - "lib/target-reading-scope-nav.ts"
      - "e2e/target-global-private-capture.spec.ts"
      - "playwright.config.ts"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character release commit SHA to check out and certify"
        required: true
        type: string
permissions:
  contents: read
jobs:
  chromium:
    name: Global private capture (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_LUMI_DESIGN_V1_PREVIEW: "1"
      E2E_SKIP_BUILD: "1"
      E2E_PORT: "3123"
      LUMI_PRIVATE_NOTE_CREATE_E2E: "true"
      LUMI_TARGET_GLOBAL_CAPTURE_E2E: "true"
      # PR checks cover both synthetic lifecycle events and real Back/reload.
      # A manual release run must OBSERVE a real pageshow.persisted cache hit.
      LUMI_REAL_BFCACHE_E2E: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
      - name: Record actual checkout SHA
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "LUMI_TESTED_CHECKOUT_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Checked out SHA: $SHA"
      - name: Prove exact target checkout (manual release)
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "target_sha=$TARGET_SHA checked_out_sha=$ACTUAL_SHA"
          [[ "$ACTUAL_SHA" == "$TARGET_SHA" ]] || exit 1
          echo "Verified checkout SHA: $ACTUAL_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.20.0
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Desktop capture and target detail invariant regressions
        run: node --experimental-loader ./tests/ts-loader.mjs --test tests/desktop-shell-ui03a.test.mjs tests/target-details-wiring.test.mjs
      - name: Build isolated UI
        run: pnpm build
      - name: Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Scoped global capture acceptance
        run: pnpm exec playwright test e2e/target-global-private-capture.spec.ts --project=desktop
      - name: Upload BFCache evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lumi-r3-global-capture
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  native-bfcache:
    name: Exact-SHA native Chrome BFCache on real personal-v1 SQLite
    if: github.event_name == 'workflow_dispatch'
    needs: chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_LUMI_DESIGN_V1_PREVIEW: "1"
      E2E_SKIP_BUILD: "1"
      E2E_PORT: "3140"
      LUMI_TARGET_PERSONAL_ACCEPTANCE_E2E: "true"
      LUMI_REAL_BFCACHE_E2E: "true"
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha }}
      - name: Verify exact SHA and record checkout
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "LUMI_TESTED_CHECKOUT_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"
          echo "Target SHA: $TARGET_SHA actual: $ACTUAL_SHA" >> "$GITHUB_STEP_SUMMARY"
          [[ "$ACTUAL_SHA" == "$TARGET_SHA" ]] || exit 1
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.20.0
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build real-store isolated application
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Observe native pageshow.persisted (390/1280)
        run: pnpm exec playwright test e2e/target-personal-native-bfcache.spec.ts --project=desktop
      - name: Upload native BFCache evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lumi-r3-global-native-bfcache
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
