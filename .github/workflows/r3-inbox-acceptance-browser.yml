name: C-3a Inbox real-store browser acceptance
on:
  pull_request:
    paths:
      - ".github/workflows/r3-inbox-acceptance-browser.yml"
      - "app/page.tsx"
      - "app/ui/lumi-app-root.tsx"
      - "app/ui/target-inbox*"
      - "app/ui/target-detail*"
      - "app/api/target-staging/inbox/**"
      - "lib/target-inbox*"
      - "lib/target-shell-views.ts"
      - "lib/target-detail-route.ts"
      - "lib/target-store*"
      - "lib/target-staging*"
      - "lib/target-data-invalidation.ts"
      - "e2e/target-inbox-acceptance.spec.ts"
      - "e2e/target-personal-store-setup.mjs"
      - "playwright.config.ts"
      - "e2e/fixtures.ts"
      - "e2e/auth.setup.ts"
      - "lib/target-personal-profile.ts"
      - "scripts/target-staging-*.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    name: Inbox Process/Undo/receipt (390/1280 real SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_LUMI_DESIGN_V1_PREVIEW: "1"
      E2E_SKIP_BUILD: "1"
      E2E_PORT: "3137"
      LUMI_TARGET_INBOX_E2E: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.20.0
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build isolated target app
        run: pnpm build
      - name: Chromium
        run: bash scripts/ci-install-chromium.sh
      - name: 390/1280 real-store Inbox, Process, Undo, receipt and deep links
        run: pnpm exec playwright test e2e/target-inbox-acceptance.spec.ts --project=desktop
      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lumi-c3a-inbox-acceptance
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
