name: Focused R3 note edit recovery browser

# Only the target-editor/receipt acceptance scenario in an isolated synthetic
# login/Next.js instance. This is NOT the full production release Browser E2E.
on:
  pull_request:
    paths:
      - ".github/workflows/r3-note-edit-recovery-browser.yml"
      - "app/ui/target-note-editor.tsx"
      - "app/ui/target-detail-edit.tsx"
      - "app/ui/target-detail-panel.tsx"
      - "app/ui/target-scope-lists.tsx"
      - "app/ui/target-data-provider.tsx"
      - "app/ui/target-detail-state.ts"
      - "app/ui/use-target-gate.ts"
      - "app/ui/lumi-app-root.tsx"
      - "app/page.tsx"
      - "lib/target-client-runtime.ts"
      - "lib/target-detail-route.ts"
      - "lib/target-staging-session-generation.ts"
      - "lib/target-note-edit-recovery.ts"
      - "lib/target-note-edit-reload.ts"
      - "lib/target-note-reload-status-client.ts"
      - "lib/target-staging-note-edit-client.ts"
      - "lib/target-note-edit-ui-gate.ts"
      - "e2e/target-note-edit-recovery.spec.ts"
      - "e2e/fixtures.ts"
      - "e2e/auth.setup.ts"
      - "playwright.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumi-r3-note-edit-recovery-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chromium:
    name: Note edit recovery (${{ matrix.profile }}, Chromium)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [legacy, combined, 4b]
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_SKIP_BUILD: "1"
      E2E_PORT: "3119"
      # This flag is consumed ONLY by the throwaway Playwright server config.
      # It is not a deployment or production feature activation.
      LUMI_TARGET_NOTE_EDIT_E2E: "true"
      LUMI_TARGET_NOTE_EDIT_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Checkout isolated PR code
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.20.0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build isolated Next.js test server
        run: pnpm build
      - name: Install targeted Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run ONLY R3 note editor recovery scenarios
        run: pnpm exec playwright test e2e/target-note-edit-recovery.spec.ts --project=desktop
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lumi-r3-note-recovery-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
