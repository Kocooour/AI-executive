name: Focused R3 personal acceptance browser
on:
  pull_request:
    paths:
      - ".github/workflows/r3-personal-acceptance-browser.yml"
      - "app/page.tsx"
      - "app/ui/lumi-app-root.tsx"
      - "app/ui/target-*.tsx"
      - "app/api/target-staging/**"
      - "lib/target-*.ts"
      - "scripts/target-staging-*.mjs"
      - "e2e/target-personal-acceptance.spec.ts"
      - "e2e/target-personal-bfcache.spec.ts"
      - "e2e/target-personal-my-plan.spec.ts"
      - "e2e/target-personal-search-open.spec.ts"
      - "e2e/target-personal-store-setup.mjs"
      - "tests/target-personal-profile.test.mjs"
      - "tests/target-app-fetch.test.mjs"
      - "playwright.config.ts"
      - "e2e/fixtures.ts"
      - "e2e/helpers.ts"
      - "e2e/auth.setup.ts"
      - "lib/auth.ts"
      - "lib/http-security.ts"
      - "lib/data-dir.ts"
      - "app/api/auth/**"
      - "scripts/hash-password.mjs"
      - "tests/ts-loader.mjs"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character release commit SHA to check out and certify"
        required: true
        type: string
permissions:
  contents: read
jobs:
  chromium:
    name: Personal acceptance on the real isolated store (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_LUMI_DESIGN_V1_PREVIEW: "1"
      E2E_SKIP_BUILD: "1"
      E2E_PORT: "3130"
      LUMI_TARGET_PERSONAL_ACCEPTANCE_E2E: "true"
      # Scoped manual release gate: actual persisted=true required on a real-store
      # navigation; PR runs still check the fallback without claiming a BFCache hit.
      LUMI_REAL_BFCACHE_E2E: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
      - name: Prove exact target checkout (manual release)
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "target_sha=$TARGET_SHA checked_out_sha=$ACTUAL_SHA"
          [[ "$ACTUAL_SHA" == "$TARGET_SHA" ]] || exit 1
          echo "Target SHA verified: \`$ACTUAL_SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.20.0
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Flag profile classification and shared read-queue tests
        run: node --experimental-loader ./tests/ts-loader.mjs --test tests/target-personal-profile.test.mjs tests/target-app-fetch.test.mjs
      - name: Build isolated UI
        run: pnpm build
      - name: Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: 390px and desktop acceptance incl. My Plan, Search and ACL (real SQLite)
        # Each filename is explicit: Playwright CLI filters even with testMatch.
        run: pnpm exec playwright test e2e/target-personal-acceptance.spec.ts e2e/target-personal-my-plan.spec.ts e2e/target-personal-search-open.spec.ts --project=desktop
      - name: Real Back / BFCache, full reload and uncertain POST (real SQLite, 390/1280)
        run: pnpm exec playwright test e2e/target-personal-bfcache.spec.ts --project=desktop
      - name: Upload BFCache evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lumi-r3-personal-acceptance
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
