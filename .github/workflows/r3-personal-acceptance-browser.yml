name: Focused R3 personal acceptance browser
on:
  pull_request:
    paths:
      - ".github/workflows/r3-personal-acceptance-browser.yml"
      - "app/page.tsx"
      - "app/ui/lumi-app-root.tsx"
      - "app/ui/target-*.tsx"
      - "app/api/target-staging/**"
      - "lib/target-*.ts"
      - "scripts/target-staging-*.mjs"
      - "e2e/target-personal-acceptance.spec.ts"
      - "e2e/target-home-attention.spec.ts"
      - "e2e/attention-test-clock.cjs"
      - "e2e/target-personal-bfcache.spec.ts"
      - "e2e/target-personal-native-bfcache.spec.ts"
      - "e2e/target-personal-native-bfcache-gate.ts"
      - "e2e/target-personal-my-plan.spec.ts"
      - "e2e/target-personal-search-open.spec.ts"
      - "e2e/target-personal-create.spec.ts"
      - "e2e/target-personal-capture-undo.spec.ts"
      - "e2e/target-personal-store-setup.mjs"
      - "tests/target-personal-profile.test.mjs"
      - "tests/target-app-fetch.test.mjs"
      - "tests/target-read-queue.test.mjs"
      - "tests/target-personal-native-bfcache-gate.test.mjs"
      - "playwright.config.ts"
      - "e2e/fixtures.ts"
      - "e2e/helpers.ts"
      - "e2e/auth.setup.ts"
      - "lib/auth.ts"
      - "lib/http-security.ts"
      - "lib/data-dir.ts"
      - "app/api/auth/**"
      - "scripts/hash-password.mjs"
      - "tests/ts-loader.mjs"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character release commit SHA to check out and certify"
        required: true
        type: string
permissions:
  contents: read
jobs:
  chromium:
    name: Personal acceptance on the real isolated store (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_LUMI_DESIGN_V1_PREVIEW: "1"
      E2E_SKIP_BUILD: "1"
      E2E_PORT: "3130"
      LUMI_TARGET_PERSONAL_ACCEPTANCE_E2E: "true"
      # Strict manual gate accepts a real restoration OR a browser-explained miss,
      # each with full privacy/authorization/no-CREATE proof. PR runs are diagnostics.
      LUMI_REAL_BFCACHE_E2E: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
      - name: Record actual checkout SHA
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "LUMI_TESTED_CHECKOUT_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Checked out SHA: $SHA"
      - name: Prove exact target checkout (manual release)
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "target_sha=$TARGET_SHA checked_out_sha=$ACTUAL_SHA"
          [[ "$ACTUAL_SHA" == "$TARGET_SHA" ]] || exit 1
          echo "Target SHA verified: \`$ACTUAL_SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.20.0
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Flag profile, read-queue and native BFCache evidence decision tests
        run: node --experimental-loader ./tests/ts-loader.mjs --test tests/target-personal-profile.test.mjs tests/target-app-fetch.test.mjs tests/target-personal-native-bfcache-gate.test.mjs
      - name: Build isolated UI
        id: build
        run: pnpm build
      - name: Chromium
        id: chromium
        run: bash scripts/ci-install-chromium.sh
      - name: 390px and desktop acceptance incl. My Plan, Search and ACL (real SQLite)
        # Each filename is explicit: Playwright CLI filters even with testMatch.
        run: |
          set -o pipefail
          pnpm exec playwright test e2e/target-personal-acceptance.spec.ts e2e/target-personal-my-plan.spec.ts e2e/target-personal-search-open.spec.ts e2e/target-personal-create.spec.ts e2e/target-personal-capture-undo.spec.ts --project=desktop --output=test-results/personal-acceptance 2>&1 | tee "$RUNNER_TEMP/lumi-personal-browser.log"
      - name: E-1 Home attention on real isolated SQLite (390/1280, fixed Prague clock)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        env:
          LUMI_TARGET_PERSONAL_ACCEPTANCE_E2E: "false"
          LUMI_TARGET_ATTENTION_E2E: "true"
        run: |
          set -o pipefail
          pnpm exec playwright test e2e/target-home-attention.spec.ts --project=desktop --output=test-results/e1-attention 2>&1 | tee -a "$RUNNER_TEMP/lumi-personal-browser.log"
      - name: E-1 off-profile regression (390/1280)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        env:
          LUMI_TARGET_PERSONAL_ACCEPTANCE_E2E: "false"
          LUMI_TARGET_ATTENTION_E2E: "off"
        run: |
          set -o pipefail
          pnpm exec playwright test e2e/target-home-attention.spec.ts --project=desktop --output=test-results/e1-off 2>&1 | tee -a "$RUNNER_TEMP/lumi-personal-browser.log"
      - name: Real Back / BFCache, full reload and uncertain POST (real SQLite, 390/1280)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: |
          set -o pipefail
          pnpm exec playwright test e2e/target-personal-bfcache.spec.ts --project=desktop --output=test-results/personal-bfcache 2>&1 | tee -a "$RUNNER_TEMP/lumi-personal-browser.log"
      - name: Native Chromium BFCache witness (no Playwright disable flag)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: |
          set -o pipefail
          pnpm exec playwright test e2e/target-personal-native-bfcache.spec.ts --project=desktop --output=test-results/personal-native-bfcache 2>&1 | tee -a "$RUNNER_TEMP/lumi-personal-browser.log"
      - name: E-1 native Chromium Back privacy (390/1280)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        env:
          LUMI_TARGET_PERSONAL_ACCEPTANCE_E2E: "false"
          LUMI_TARGET_ATTENTION_E2E: "true"
          LUMI_TARGET_ATTENTION_NATIVE_E2E: "true"
        run: |
          set -o pipefail
          pnpm exec playwright test e2e/target-personal-native-bfcache.spec.ts --project=desktop --output=test-results/e1-native-bfcache 2>&1 | tee -a "$RUNNER_TEMP/lumi-personal-browser.log"
      - name: No My Plan child-page unavailability in real-store server logs
        if: always()
        run: |
          LOG="$RUNNER_TEMP/lumi-personal-browser.log"
          if [ ! -f "$LOG" ]; then
            echo "::error::Missing server/browser log evidence"
            exit 1
          fi
          if grep -Fn "stage=my_plan_slice reason=child_page_unavailable" "$LOG"; then
            echo "::error::My Plan staging child became unavailable during personal acceptance"
            exit 1
          fi
          echo "Verified: zero my_plan_slice child_page_unavailable events in all executed personal browser runs."
      # Playwright clears its own outputDir before each invocation. Keep every
      # suite in a distinct child directory so later runs cannot erase earlier
      # native evidence or failure traces. Archive the entire parent on failure too.
      - name: Upload BFCache evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lumi-r3-personal-acceptance
          path: |
            test-results/
            playwright-report/
            ${{ runner.temp }}/lumi-personal-browser.log
          retention-days: 7
          if-no-files-found: ignore
