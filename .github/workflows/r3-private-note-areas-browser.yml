name: Focused R3 private note Area chooser browser

# One actor-private read-only UI flow in an isolated synthetic Chromium server.
# This is NOT the full pre-production Browser E2E suite.
on:
  pull_request:
    paths:
      - ".github/workflows/r3-private-note-areas-browser.yml"
      - "app/page.tsx"
      - "app/ui/lumi-app-root.tsx"
      - "app/ui/target-private-note-area-chooser.tsx"
      - "app/ui/target-data-provider.tsx"
      - "app/ui/target-scope-lists.tsx"
      - "app/ui/use-target-revalidation.ts"
      - "lib/target-private-note-area-client.ts"
      - "lib/target-private-note-area-ui-gate.ts"
      - "lib/target-client-runtime.ts"
      - "lib/target-staging-session-generation.ts"
      - "lib/target-ui-config.ts"
      - "e2e/target-private-note-areas.spec.ts"
      - "e2e/auth.setup.ts"
      - "e2e/fixtures.ts"
      - "playwright.config.ts"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumi-r3-private-note-area-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  chromium:
    name: Private note Area chooser (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_SKIP_BUILD: "1"
      E2E_PORT: "3121"
      LUMI_PRIVATE_NOTE_AREAS_E2E: "true"
    steps:
      - name: Checkout isolated PR code
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.20.0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build isolated Next.js UI
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run ONLY private Area chooser UI scenarios
        run: pnpm exec playwright test e2e/target-private-note-areas.spec.ts --project=desktop
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lumi-private-note-area-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
