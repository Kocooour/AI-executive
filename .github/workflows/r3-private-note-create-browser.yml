name: Focused R3 private note creation browser
on:
  pull_request:
    paths:
      - ".github/workflows/r3-private-note-create-browser.yml"
      - "app/page.tsx"
      - "app/ui/lumi-app-root.tsx"
      - "app/ui/target-private-note-area-chooser.tsx"
      - "app/ui/target-data-provider.tsx"
      - "app/api/target-staging/notes/**"
      - "lib/target-private-note-create-*"
      - "lib/target-note-create-*"
      - "lib/target-staging-note-create-process.ts"
      - "lib/target-note-lifecycle-writer.ts"
      - "lib/target-staging-durable-session.ts"
      - "lib/target-client-runtime.ts"
      - "lib/target-private-note-area-client.ts"
      - "lib/target-private-note-area-ui-gate.ts"
      - "lib/target-staging-session-generation.ts"
      - "lib/target-staging-http-identity.ts"
      - "e2e/target-private-note-create.spec.ts"
      - "e2e/auth.setup.ts"
      - "e2e/fixtures.ts"
      - "playwright.config.ts"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    name: Private note create + receipt (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_SKIP_BUILD: "1"
      E2E_PORT: "3122"
      LUMI_PRIVATE_NOTE_CREATE_E2E: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.20.0
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build isolated UI
        run: pnpm build
      - name: Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Scoped private note create flows
        run: pnpm exec playwright test e2e/target-private-note-create.spec.ts --project=desktop
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lumi-r3-private-create
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
