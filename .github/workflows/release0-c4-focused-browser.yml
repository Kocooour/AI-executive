name: Release 0 C4 focused legacy browser regressions

# Targeted investigation only. The complete Browser E2E remains the
# manual production-release gate; no preview or target staging flags here.
on:
  pull_request:
    paths:
      - ".github/workflows/release0-c4-focused-browser.yml"
      - "app/ui/use-lumi-app.tsx"
      - "app/ui/views/detail-panel.tsx"
      - "app/ui/views/defer-popover.tsx"
      - "tests/target-details-wiring.test.mjs"
      - "e2e/record-links-ui01.spec.ts"
      - "e2e/navigation-unavailable-ui01c.spec.ts"
      - "e2e/attention-open.spec.ts"
      - "e2e/project-page.spec.ts"
      - "e2e/inspector-return-focus-ui01e.spec.ts"
      - "e2e/detail-inspector-b2.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumi-release0-c4-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  focused-browser:
    name: C4 cases + C10 inspector acceptance (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_PORT: "3130"
      E2E_SKIP_BUILD: "1"
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.20.0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build without mobile-design preview
        run: pnpm build
      - name: Install focused Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Seven focused failing or locally reported cases only
        shell: bash
        run: |
          pnpm exec playwright test \
            e2e/attention-open.spec.ts \
            e2e/inspector-return-focus-ui01e.spec.ts \
            e2e/project-page.spec.ts \
            e2e/record-links-ui01.spec.ts \
            --project=desktop \
            --grep 'a synced task edit|a fresh Attention refresh|UI-01e: keyboard A|aggregate project deep links|current project relation rejects' \
            --trace=on
      - name: C10 inspector specs independently (default-off production build)
        shell: bash
        run: |
          pnpm exec playwright test e2e/detail-inspector-b2.spec.ts \
            --project=desktop --workers=1 --trace=on
          pnpm exec playwright test e2e/inspector-return-focus-ui01e.spec.ts \
            --project=desktop --workers=1 --trace=on
      - name: C10 ordered navigation then both complete inspector suites
        shell: bash
        run: |
          # Playwright --list reports paths relative to testDir (e2e/), unlike
          # its execution logs. Use exactly those titles for the ordered list.
          test_list="${RUNNER_TEMP}/release0-c10-inspector.test-list"
          discovery="${RUNNER_TEMP}/release0-c10-discovery.txt"
          plan="${RUNNER_TEMP}/release0-c10-plan.txt"
          results="${RUNNER_TEMP}/release0-c10-results.txt"
          pnpm exec playwright test \
            e2e/record-links-ui01.spec.ts \
            e2e/navigation-unavailable-ui01c.spec.ts \
            e2e/project-page.spec.ts \
            e2e/detail-inspector-b2.spec.ts \
            e2e/inspector-return-focus-ui01e.spec.ts \
            --project=desktop --list | tee "${discovery}"
          node - "${discovery}" "${test_list}" <<'NODE'
          const fs = require("node:fs");
          const lines = fs.readFileSync(process.argv[2], "utf8")
            .replace(/\x1b\[[0-9;]*m/g, "").split(/\r?\n/);
          const specs = ["record-links-ui01", "navigation-unavailable-ui01c",
            "project-page", "detail-inspector-b2", "inspector-return-focus-ui01e"];
          const selected = [];
          for (const spec of specs) {
            const marker = `[desktop] › ${spec}.spec.ts:`;
            const matches = lines.filter((line) => line.includes(marker))
              .map((line) => line.trim());
            if (!matches.length) throw new Error(`No discovered tests in ${spec}`);
            selected.push(...matches);
          }
          fs.writeFileSync(process.argv[3], selected.join("\n") + "\n");
          console.log(`C10 selected ${selected.length} actual tests in required file order`);
          NODE
          # Fail closed before launching the browser unless each file was
          # selected by Playwright's own parser, and later at least one test ran.
          pnpm exec playwright test --list --test-list "${test_list}" \
            --project=desktop | tee "${plan}"
          for spec in record-links-ui01 navigation-unavailable-ui01c project-page detail-inspector-b2 inspector-return-focus-ui01e; do
            grep -Fq "[desktop] › ${spec}.spec.ts" "${plan}" || {
              echo "C10 ordered gate selected no tests from ${spec}" >&2
              exit 1
            }
          done
          pnpm exec playwright test --test-list "${test_list}" \
            --project=desktop --workers=1 --trace=on 2>&1 | tee "${results}"
          grep -Eq '[[:space:]][1-9][0-9]* passed' "${results}" || {
            echo "C10 ordered gate did not execute any passing browser tests" >&2
            exit 1
          }
      - name: Upload focused traces on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lumi-release0-c4-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
