name: Focused IndexedDB browser

on:
  pull_request:
    paths:
      - ".github/workflows/target-sync-indexeddb.yml"
      - "lib/target-sync/**"
      - "lib/target-note-lifecycle-*.ts"
      - "lib/target-note-sync-read-model.ts"
      - "lib/target-store-bootstrap.ts"
      - "lib/target-store-preflight.ts"
      - "tests/target-note-lifecycle-journal.test.mjs"
      - "e2e/target-sync-indexeddb.spec.ts"
      - "e2e/note-persistent-indexeddb.spec.ts"
      - "e2e/note-lease-indexeddb.spec.ts"
      - "e2e/note-leased-client-indexeddb.spec.ts"
      - "e2e/playwright.indexeddb.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexeddb-browser-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chromium:
    name: IndexedDB regression (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused note checkpoint and error classification unit tests
        run: node --experimental-loader ./tests/ts-loader.mjs --test tests/target-note-sync-persistent.test.mjs tests/server-errors.test.mjs tests/target-note-lifecycle-journal.test.mjs tests/target-note-sync-read-model.test.mjs tests/target-note-sync-pages.test.mjs
      - name: Install focused browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run isolated IndexedDB scenarios
        run: pnpm exec playwright test --config e2e/playwright.indexeddb.config.ts
