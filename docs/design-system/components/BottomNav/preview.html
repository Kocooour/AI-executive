<style>
body{margin:0;font-family:var(--font-sans);color:var(--text);background:var(--sidebar-bg)}
.row{display:flex;gap:16px;padding:12px;flex-wrap:wrap}
.p{--wsc:var(--ws-personal);--wss:var(--ws-personal-soft)} .w{--wsc:var(--ws-work);--wss:var(--ws-work-soft)} .f{--wsc:var(--ws-family);--wss:var(--ws-family-soft)}
.phone{width:300px;height:440px;position:relative;background:var(--app-bg);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.band{height:3px;background:var(--wsc)}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px}
.ws{font:inherit;font-size:14px;display:flex;gap:6px;align-items:center;min-height:44px;border:0;background:none;color:var(--text);padding:0}
.tile{width:24px;height:24px;border-radius:6px;background:var(--wsc);color:var(--on-ws);display:grid;place-items:center;font-size:12px;font-weight:700}
.ai{font-size:12px;color:var(--accent);font-weight:650}
h1{margin:4px 16px 8px;font-size:28px;font-weight:720;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.big{width:24px;height:24px} .big svg{width:24px;height:24px}
ul{list-style:none;margin:0;padding:0 8px}
li{display:flex;gap:10px;align-items:center;min-height:44px;padding:0 8px;font-size:15px}
.c{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--control-border)}
.r{margin-left:auto;font-size:12px;color:var(--muted)}
.fab{position:absolute;right:14px;bottom:76px;width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:24px}
nav{position:absolute;left:0;right:0;bottom:0;height:60px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--sidebar-bg);border-top:1px solid var(--line)}
nav a{display:grid;place-items:center;align-content:center;gap:2px;color:var(--text);margin:6px 3px;border-radius:var(--radius-md)}
nav span{font-size:10px;font-weight:500} nav a.on{background:var(--wss)} nav a.on span{font-weight:700}
i{font-style:normal;width:18px;height:18px;flex:none;display:inline-grid;place-items:center;font-size:16px;line-height:1} i svg{display:block}
.i-home{color:var(--icon-home)} .i-inbox{color:var(--icon-inbox)} .i-today{color:var(--icon-today)} .i-upcoming{color:var(--icon-upcoming)} .i-projects{color:var(--icon-projects)} .i-areas{color:var(--icon-areas)} .i-notes{color:var(--icon-notes)} .i-calendar{color:var(--icon-calendar)} .i-search{color:var(--icon-search)} .i-more{color:var(--icon-home)} .i-settings{color:var(--muted)}
nav i{width:20px;height:20px;font-size:18px} nav i svg{width:18px;height:18px}
.dim::after{content:"";position:absolute;inset:3px 0 60px;background:var(--overlay)}
.sheet{position:absolute;left:0;right:0;bottom:60px;z-index:1;background:var(--surface-raised);border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:6px 12px 12px}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto 4px}
.sh{padding:0} .sh button{width:44px;height:44px;border:0;background:none;color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.grid a{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:var(--radius-md);background:var(--surface-subtle);font-size:13px}
</style>
