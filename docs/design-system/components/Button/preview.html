<!-- @dsCard group="Akce" height=150 subtitle="Primární · Sekundární · Textové · Destruktivní" -->
<div class="row">
  <button class="primary">Přidat úkol</button>
  <button class="secondary">Otevřít</button>
  <button class="text">Odložit</button>
  <button class="danger">Smazat</button>
  <button class="primary" disabled>Schválit</button>
  <button class="secondary focus">Fokus</button>
</div>
<style>
body{margin:0;background:var(--app-bg);font-family:var(--font-sans);color:var(--text);padding:var(--space-4)}
.row{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:13px;font-weight:650;min-height:36px;padding:0 14px;border-radius:var(--radius-md);cursor:pointer}
button:focus-visible,.focus{outline:2px solid var(--focus-ring);outline-offset:2px}
.primary{background:var(--accent);color:var(--on-accent);border:0}
.primary:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:var(--surface);color:var(--text);border:1px solid var(--control-border)}
.text{background:none;border:0;color:var(--accent)}
.danger{background:var(--surface);color:var(--danger);border:1px solid var(--danger)}
</style>
