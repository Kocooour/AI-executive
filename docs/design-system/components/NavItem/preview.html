<style>
body{margin:0;font-family:var(--font-sans);color:var(--text);background:var(--app-bg)}
.row{display:flex;gap:12px;padding:12px;flex-wrap:wrap}
nav{width:204px;padding:10px;display:grid;gap:2px;background:var(--sidebar-bg);border-radius:var(--radius-lg);border-top:3px solid var(--wsc)}
.p{--wsc:var(--ws-personal);--wss:var(--ws-personal-soft)} .w{--wsc:var(--ws-work);--wss:var(--ws-work-soft)} .f{--wsc:var(--ws-family);--wss:var(--ws-family-soft)}
.ws{display:flex;align-items:center;gap:8px;padding:6px 8px 10px;font-size:14px}
.tile{width:22px;height:22px;border-radius:6px;background:var(--wsc);color:var(--on-ws);display:grid;place-items:center;font-size:12px;font-weight:700}
.chev{margin-left:auto;color:var(--muted-light)}
.item{display:flex;align-items:center;gap:9px;min-height:34px;padding:0 8px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;color:var(--text)}
.item:hover{background:var(--hover)}
.item.active{background:var(--wss);color:var(--selected-text);font-weight:700}
i{font-style:normal;width:18px;height:18px;flex:none;display:inline-grid;place-items:center;font-size:16px;line-height:1} i svg{display:block}
.i-home{color:var(--icon-home)} .i-inbox{color:var(--icon-inbox)} .i-today{color:var(--icon-today)} .i-upcoming{color:var(--icon-upcoming)} .i-projects{color:var(--icon-projects)} .i-areas{color:var(--icon-areas)} .i-notes{color:var(--icon-notes)} .i-calendar{color:var(--icon-calendar)} .i-search{color:var(--icon-search)} .i-more{color:var(--icon-home)} .i-settings{color:var(--muted)}
em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted-light)} .active em{color:var(--selected-text);font-weight:600}
</style>
