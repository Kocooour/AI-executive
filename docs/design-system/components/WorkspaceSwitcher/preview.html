<link rel="stylesheet" href="../../tokens.css">
<section class="lv1 lv1-scopes" aria-label="Globální filtr čtecího rozsahu" style="display:grid;gap:13px;max-width:480px;padding:14px;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:16px">
  <h2 style="margin:0;font-size:17px">Zobrazit</h2>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px">
    <button aria-pressed="true" style="background:#F3E8FF;color:#6D28D9;border:2px solid #8B5CF6">Vše</button>
    <button aria-pressed="false" style="background:#DCFCE7;color:#166534;border:1px solid #86EFAC">Osobní</button>
    <button aria-pressed="false" style="background:#DBEAFE;color:#1D4ED8;border:1px solid #93C5FD">Sdílené</button>
  </div>
  <div style="padding:12px;background:#F8FAFC;border-radius:12px;color:#475569;font-size:13px">Vše znamená všechny oprávněné položky. <strong>Můj plán</strong> je samostatná úvodní obrazovka pouze mé práce; není čtvrtý filtr.</div>
</section>
<style>.lv1{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:#0F172A;font-size:14px}.lv1 *{box-sizing:border-box}.lv1 .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.lv1 .scope{display:flex;align-items:center;gap:7px;color:#6D28D9;font-weight:650}.lv1 .taskName{font-size:17px;font-weight:650;color:#0F172A}.lv1 .mutedName{font-size:17px;font-weight:650;color:#475569}.lv1 .group{padding:12px;border-radius:14px;display:grid;gap:9px}.lv1 .personal{background:#DCFCE7}.lv1 .work{background:#DBEAFE}.lv1 .family{background:#FCE7F3}.lv1 .item{display:flex;align-items:center;gap:12px;min-height:44px}.lv1 .state{width:23px;height:23px;flex:none;display:grid;place-items:center;border:2px solid #64748B;background:transparent;border-radius:5px}.lv1 .state.project{border-radius:50%}.lv1 .state.red{border-color:#B91C1C}.lv1 .state.amber{border-color:#B45309}.lv1 .state.done{background:#64748B;border-color:#64748B;color:#FFF;font-weight:800;font-size:16px}.lv1-scopes button{min-height:44px;border-radius:10px;font:inherit;font-weight:700;cursor:default}</style>
