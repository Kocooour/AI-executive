<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Lumi – šetrná obnova</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; background: Canvas; color: CanvasText; }
      main { box-sizing: border-box; width: min(88vw, 420px); padding: 28px; text-align: center; }
      .mark { display: inline-block; width: 52px; height: 52px; border-radius: 14px; }
      h1 { margin: 22px 0 12px; font-size: 25px; }
      p { margin: 0; color: GrayText; line-height: 1.5; }
      a { display: block; margin-top: 24px; padding: 13px 18px; border-radius: 12px; background: #6254e8; color: white; font-weight: 650; text-decoration: none; }
      a:focus-visible { outline: 3px solid #f3bc46; outline-offset: 3px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icons/lumi-icon-v2-192.png" alt="" width="52" height="52" />
      <h1 id="title">Obnovuji aplikaci…</h1>
      <p id="status" role="status">Odstraňuji starou mezipaměť aplikace.</p>
      <a id="open-app" href="/" hidden>Otevřít Lumi</a>
    </main>
    <script>
      (async () => {
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.filter((key) => key.startsWith("ai-executive-")).map((key) => caches.delete(key)));
          }
          document.getElementById("title").textContent = "Obnova dokončena";
          document.getElementById("status").textContent =
            "Osobní data, přihlášení a passkey zůstaly zachované. Teď můžete aplikaci znovu otevřít.";
          const link = document.getElementById("open-app");
          link.href = "/?refresh=" + Date.now();
          link.hidden = false;
        } catch {
          document.getElementById("title").textContent = "Obnova se nepodařila";
          document.getElementById("status").textContent =
            "Zavřete ostatní karty Lumi a zkuste stránku načíst znovu. Vaše data zůstala zachovaná.";
        }
      })();
    </script>
  </body>
</html>
